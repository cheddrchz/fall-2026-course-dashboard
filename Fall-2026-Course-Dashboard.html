function openMoodle(ci,ii){let key='moodle-'+ci+'-'+ii;window.open(localStorage.getItem(key)||moodle,'_blank','noopener')}
function editLink(ci,ii){currentItem={ci,ii};document.getElementById('editName').textContent=courses[ci].items[ii][0];document.getElementById('urlInput').value=localStorage.getItem('moodle-'+ci+'-'+ii)||moodle;document.getElementById('modal').classList.add('open')}
function editAssignment(ci,ii){currentItem={ci,ii};let x=courses[ci].items[ii];document.getElementById('assignmentHeading').textContent='Edit assignment';document.getElementById('assignmentCourse').value=ci;document.getElementById('assignmentTitle').value=x[0];document.getElementById('assignmentDate').value=x[1];document.getElementById('assignmentTime').value=x[2]==='11:59 PM'?'23:59':x[2];document.getElementById('assignmentNote').value=x[3];document.getElementById('assignmentModal').classList.add('open')}
function addAssignment(ci){currentItem={ci,ii:null};document.getElementById('assignmentHeading').textContent='Add assignment';document.getElementById('assignmentCourse').value=ci;document.getElementById('assignmentTitle').value='';document.getElementById('assignmentDate').value='';document.getElementById('assignmentTime').value='23:59';document.getElementById('assignmentNote').value='Added by user';document.getElementById('assignmentModal').classList.add('open')}
function deleteAssignment(ci,ii){if(confirm('Delete this assignment?')){courses[ci].items.splice(ii,1);localStorage.setItem('dashboard-courses',JSON.stringify(courses));renderCourses();render();showCourse(courses[ci])}}
function saveAssignment(){let ci=+document.getElementById('assignmentCourse').value,title=document.getElementById('assignmentTitle').value.trim(),date=document.getElementById('assignmentDate').value,time=document.getElementById('assignmentTime').value,note=document.getElementById('assignmentNote').value.trim()||'Added by user';if(!title||!date||!time){alert('Please enter a title, date, and time.');return}let hh=+time.slice(0,2),mm=time.slice(3),display=(hh%12||12)+':'+mm+' '+(hh<12?'AM':'PM');if(currentItem.ii===null)courses[ci].items.push([title,date,display,note]);else{courses[ci].items[currentItem.ii]=[title,date,display,note]}localStorage.setItem('dashboard-courses',JSON.stringify(courses));document.getElementById('assignmentModal').classList.remove('open');renderCourses();render();showCourse(courses[ci])}
function populateAssignmentCourses(){let s=document.getElementById('assignmentCourse');courses.forEach((c,i)=>{let o=document.createElement('option');o.value=i;o.textContent=c.code+' — '+c.name;s.appendChild(o)})}
function renderChecklist(){let now=new Date(),iso=now.toISOString().slice(0,10),items=all().filter(x=>x.date<=iso&&localStorage.getItem('checked-'+x.date+'-'+x.course.code+'-'+x.title)!=='1'),dateText=new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(now),html=items.length?items.map(x=>{let key='checked-'+x.date+'-'+x.course.code+'-'+x.title,overdue=x.date<iso;return '<label class="checkItem '+(overdue?'overdue':'')+'" style="display:flex;align-items:flex-start;gap:9px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer"><input type="checkbox" data-check="'+key+'" style="width:18px;height:18px;accent-color:var(--good)"><span style="flex:1;font-size:12px"><b>'+x.title+'</b><br><span class="sub">'+x.course.code+' · due '+fmt(x.date)+' · '+x.time+(overdue?' · <strong>OVERDUE</strong>':'')+'</span></span></label>'}).join(''):'<div class="empty">Nothing is due or overdue.</div>';['checklistDate','inlineChecklistDate'].forEach(id=>{let e=document.getElementById(id);if(e)e.textContent=dateText});['checklistItems','inlineChecklistItems'].forEach(id=>{let e=document.getElementById(id);if(e){e.innerHTML=html;e.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{let row=c.closest('.checkItem');row.classList.add('completed');setTimeout(()=>{localStorage.setItem(c.dataset.check,c.checked?'1':'0');renderChecklist();render()},700)})}})}
function showChecklist(){document.querySelector('header').style.display='none';document.querySelector('main.layout').style.display='none';document.getElementById('todayScreen').style.display='block';renderChecklist()}
function showDashboard(){document.querySelector('header').style.display='flex';document.querySelector('main.layout').style.display='grid';document.getElementById('todayScreen').style.display='none';document.getElementById('assignmentScreen').style.display='none';requestAnimationFrame(()=>{window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0})}

function applyTheme(){let day=localStorage.getItem('dashboard-theme')==='day';document.body.classList.toggle('dayMode',day);document.getElementById('themeToggle').textContent=day?'☾ Night mode':'☼ Day mode'}
function toggleTheme(){let day=!document.body.classList.contains('dayMode');localStorage.setItem('dashboard-theme',day?'day':'night');applyTheme()}

document.getElementById('save').onclick=()=>{localStorage.setItem('moodle-'+currentItem.ci+'-'+currentItem.ii,document.getElementById('urlInput').value.trim()||moodle);document.getElementById('modal').classList.remove('open')};document.getElementById('cancel').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('assignmentCancel').onclick=()=>document.getElementById('assignmentModal').classList.remove('open');document.getElementById('assignmentSave').onclick=saveAssignment;document.getElementById('addEvent').onclick=()=>addAssignment(0);document.getElementById('assignmentList').onclick=()=>showAssignmentScreen(courses.find(c=>c.code===selected)||courses[0]);document.getElementById('themeToggle').onclick=toggleTheme;document.getElementById('todayChecklist').onclick=showChecklist;document.getElementById('backToDashboard').onclick=showDashboard;document.getElementById('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};document.getElementById('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};document.getElementById('filter').onchange=e=>{selected=e.target.value;render()};populateAssignmentCourses();renderCourses();render();renderChecklist();applyTheme();
</script><!-- MOBILE PLANNER START -->

 #mobilePlanner .mobile-complete{flex-shrink:0;display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;background:transparent!important}
 .mobile-complete span{width:19px;height:19px;border:1.5px solid var(--mp-muted);border-radius:6px}

 .dayMode .mobile-course-label{color:var(--course-day)}
 .mobile-card-title{display:block;font-size:14px;font-weight:600;line-height:1.5;overflow-wrap:anywhere;letter-spacing:-.1px}
 .mobile-card-time{display:block;font-size:11px;color:var(--mp-muted);margin-top:9px}

 #mobileNav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;background:var(--mp-bg);border-top:1px solid var(--mp-line);padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
 #mobileNav button{flex:1;min-height:48px;border:0;border-radius:10px;background:transparent!important;color:var(--mp-muted)!important;font-size:10px;padding:4px}

 #mobileNav button[aria-current=page]{color:var(--mp-accent)!important}
 #mobilePlanner button:focus-visible,#mobileNav button:focus-visible{outline:2px solid var(--mp-accent);outline-offset:2px}

 #assignmentScreen,#todayScreen{padding:24px 18px!important;color:var(--mp-text)}
 #assignmentScreen .panel,#todayScreen .panel{background:var(--mp-bg);border:0;padding:0!important;box-shadow:none}
 #assignmentScreen ul{padding:0}.assignmentItem{background:var(--mp-surface);border-color:var(--mp-line)}

 .modalbox input,.modalbox select{font-size:16px!important;min-height:44px}

<script>
/* Separate mobile presentation; original data and persistence are shared. */
(() => {
  const root = document.createElement('section');
  root.id = 'mobilePlanner';
  root.setAttribute('aria-label', 'Course planner');
  document.body.append(root);
  const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const iso = date => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  const today = () => iso(new Date());
  const dateFor = value => new Date(`${value}T12:00:00`);
  const keyFor = item => `checked-${item.date}-${item.course.code}-${item.title}`;
  const colors = [['#b9a7f5','#72549a'],['#88cbbb','#28735f'],['#e3ce8a','#846819'],['#e7b182','#9c5d24']];
  let focus = today();
  let mode = 'agenda';
  const visibleItems = () => all().filter(x => x.date >= today() && (selected === 'all' || x.course.code === selected) && localStorage.getItem(keyFor(x)) !== '1').sort((a,b) => a.date.localeCompare(b.date));
  function draw() {
    const list = visibleItems();
    const cursor = dateFor(focus);
    const start = new Date(cursor); start.setDate(start.getDate()-start.getDay());
    const week = Array.from({length:7},(_,i) => {const d=new Date(start);d.setDate(d.getDate()+i);return d;});
    const monthList = list.filter(x => mode === 'day' ? x.date === focus : x.date.startsWith(focus.slice(0,7)));
    const grouped = new Map();
    monthList.forEach(x => {if(!grouped.has(x.date)) grouped.set(x.date,[]);grouped.get(x.date).push(x);});
    root.innerHTML = `<div class="mobile-heading"><div class="mobile-eyebrow">FALL SEMESTER / 2026</div><h1>Your semester.</h1><div class="mobile-subtitle">Less juggling. More breathing room.</div><button class="mobile-add" aria-label="Add assignment">+</button></div>
      <div class="mobile-tabs" role="tablist" aria-label="Planner view"><button class="mobile-tab" data-mode="agenda" role="tab" aria-selected="${mode==='agenda'}">Agenda</button><button class="mobile-tab" data-mode="day" role="tab" aria-selected="${mode==='day'}">Day view</button><button class="mobile-tab" data-today>Today</button></div>
      <div class="mobile-month-row"><h2>${cursor.toLocaleDateString('en-US',{month:'long'})} <span>${cursor.getFullYear()}</span></h2><div><button class="mobile-arrow" data-month="-1" aria-label="Previous month">‹</button><button class="mobile-arrow" data-month="1" aria-label="Next month">›</button></div></div>
      <div class="mobile-week-navigation"><button class="mobile-arrow" data-week="-1" aria-label="Previous week">‹</button><span>Week of ${start.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span><button class="mobile-arrow" data-week="1" aria-label="Next week">›</button></div><div class="mobile-week" aria-label="Week">${week.map(d => `<button class="mobile-day" aria-label="${d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}" aria-pressed="${iso(d)===focus}" data-date="${iso(d)}">${d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase()}<b>${d.getDate()}</b><i style="opacity:${list.some(x=>x.date===iso(d))?1:0}"></i></button>`).join('')}</div>
      <div class="mobile-filters" aria-label="Filter by class">${[['all','All classes'],...courses.map(c=>[c.code,c.code.startsWith('MGT')?'MGT':c.code])].map(([code,label])=>`<button class="mobile-filter" data-filter="${escape(code)}" aria-pressed="${selected===code}">${escape(label)}</button>`).join('')}</div>
      <div class="mobile-range">${mode==='day'?'Selected day':'Upcoming this month'}</div><div id="mobileAgenda">${grouped.size?[...grouped].map(([date,items])=>`<section class="mobile-group" data-group="${date}"><h3>${dateFor(date).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}<span>${date===today()?'Today':''}</span></h3>${items.map(x=>{const ci=courses.indexOf(x.course),ii=x.course.items.findIndex(v=>v[0]===x.title&&v[1]===x.date);return `<article class="mobile-card" style="--course-color:${colors[ci%colors.length][0]};--course-day:${colors[ci%colors.length][1]}"><button class="mobile-complete" data-ci="${ci}" data-ii="${ii}" aria-label="Complete ${escape(x.title)}"><span></span></button><button class="mobile-card-link" data-ci="${ci}" data-ii="${ii}"><span class="mobile-course-label">${escape(x.course.code)}</span><span class="mobile-card-title">${escape(x.title)}</span><span class="mobile-card-time">◷ &nbsp; ${escape(x.time)}</span></button></article>`;}).join('')}</section>`).join(''):`<div class="mobile-empty">${mode==='day'?'Nothing due on this day.':'No upcoming assignments this month.'}</div>`}</div>`;
  }
  const toast = document.createElement('div');
  toast.className='mobile-toast';toast.hidden=true;toast.setAttribute('role','status');
  toast.innerHTML='<span>Assignment completed</span><button id="mobileUndo">Undo</button>';
  document.body.append(toast);
  let lastCompleted=null, toastTimer;
  toast.querySelector('button').onclick=()=>{if(lastCompleted){localStorage.setItem(lastCompleted,'0');lastCompleted=null;toast.hidden=true;draw();render();renderChecklist();}};
  const nav=document.createElement('nav');nav.id='mobileNav';nav.setAttribute('aria-label','Main navigation');
  const icons={planner:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18M8 15h2m4 0h2"/>',checklist:'<path d="m3 6 2 2 3-4m3 2h10M3 13l2 2 3-4m3 2h10M3 20l2 2 3-4m3 2h10"/>',assignments:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',theme:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/>'};
  nav.innerHTML=[['planner','Planner'],['checklist','Checklist'],['assignments','Assignments'],['theme','Day mode']].map(([id,label])=>`<button data-nav="${id}" ${id==='planner'?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${icons[id]}</svg><span>${label}</span></button>`).join('');
  document.body.append(nav);
  const setNav=active=>nav.querySelectorAll('[data-nav]').forEach(b=>{if(b.dataset.nav===active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  const originalDashboard=showDashboard,originalAssignments=showAssignmentScreen,originalChecklist=showChecklist;
  showDashboard=function(){originalDashboard();root.hidden=false;draw();setNav('planner');};
  showAssignmentScreen=function(c){originalAssignments(c);root.hidden=true;setNav('assignments');};
  showChecklist=function(){document.getElementById('assignmentScreen').style.display='none';originalChecklist();root.hidden=true;setNav('checklist');window.scrollTo(0,0);};
  document.getElementById('todayChecklist').onclick=showChecklist;
  document.getElementById('backToDashboard').onclick=showDashboard;
  const themeLabel=()=>{nav.querySelector('[data-nav="theme"] span').textContent=document.body.classList.contains('dayMode')?'Night mode':'Day mode';};
  nav.onclick=event=>{const b=event.target.closest('[data-nav]');if(!b)return;switch(b.dataset.nav){case 'planner':showDashboard();break;case 'checklist':showChecklist();break;case 'assignments':showAssignmentScreen(courses.find(c=>c.code===selected)||courses[0]);break;case 'theme':toggleTheme();themeLabel();break;}};
  themeLabel();
  // Rendering the original app also refreshes mobile data after edits/checklist actions.
  const originalRender=render;
  render=function(){originalRender();draw();};
  const mq=matchMedia('(max-width:950px)');
  mq.addEventListener('change',()=>{root.hidden=document.getElementById('assignmentScreen').style.display==='block'||document.getElementById('todayScreen').style.display==='block';draw();});
  root.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button) return;
    if(button.classList.contains('mobile-add')){addAssignment(Math.max(0,courses.findIndex(c=>c.code===selected)));return;}
    if(button.classList.contains('mobile-card-link')){showAssignmentScreen(courses[Number(button.dataset.ci)]);return;}
    if(button.classList.contains('mobile-complete')) {
      const c=courses[Number(button.dataset.ci)], item=c.items[Number(button.dataset.ii)];
      lastCompleted=keyFor({date:item[1],course:c,title:item[0]});
      localStorage.setItem(lastCompleted,'1');render();renderChecklist();
      toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.hidden=true;},8000);
    }
    if (button.hasAttribute('data-filter')) {selected=button.dataset.filter; document.getElementById('filter').value=selected;render();}
    if (button.hasAttribute('data-month')) {const d=dateFor(focus);d.setDate(1);d.setMonth(d.getMonth()+Number(button.dataset.month));focus=iso(d);}
    if (button.hasAttribute('data-week')) {const d=dateFor(focus);d.setDate(d.getDate()+7*Number(button.dataset.week));focus=iso(d);}
    if (button.hasAttribute('data-date')) focus=button.dataset.date;
    if (button.hasAttribute('data-mode')) mode=button.dataset.mode;
    if (button.hasAttribute('data-today')) focus=today();
    draw();
    if(button.hasAttribute('data-date') && mode==='agenda') root.querySelector(`[data-group="${focus}"]`)?.scrollIntoView({block:'start',behavior:'smooth'});
  });
  draw();
})();

</script>
<!-- MOBILE PLANNER END --></body></html>
